<template>
  <lightning-card title="Engagement Summary">
    <template if:true={summary}>
      <div class="slds-p-around_small">
        <p>
          <strong>Opportunity Amount:</strong>
          <lightning-formatted-number
            value={summary.opportunityAmount}
            format-style="currency">
          </lightning-formatted-number>
        </p>

        <p>
          <strong>Completed Tasks:</strong>
          {summary.completedTasks}
        </p>

        <p>
          <strong>Upcoming Events:</strong>
          {summary.upcomingEvents}
        </p>

        <lightning-button
          label="Quick Follow-Up Call"
          variant="brand"
          class="slds-m-top_small"
          onclick={handleQuickCall}>
        </lightning-button>
      </div>
    </template>

    <template if:true={error}>
      <div class="slds-p-around_small slds-text-color_error">
        Error loading engagement summary
      </div>
    </template>
  </lightning-card>
</template>
